# Blueprint do Render (render.com) — permite criar o serviço web + o banco
# Postgres de uma vez só via "New +" → "Blueprint" no painel do Render,
# apontando para este repositório. Depois disso só falta preencher, no
# painel, as variáveis marcadas como "sync: false" (SITE_URL, MAIL_*) — ver
# o passo a passo de deploy para o significado de cada uma.
databases:
  - name: avie-db
    plan: starter
    databaseName: avie
    user: avie

services:
  - type: web
    name: avie-app
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: AVIE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: avie-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
