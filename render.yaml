# Blueprint do Render (render.com) — permite criar o serviço web de uma vez
# só via "New +" → "Blueprint" no painel do Render, apontando para este
# repositório. Depois disso só falta preencher, no painel, as variáveis
# marcadas como "sync: false" — ver o passo a passo de deploy para o
# significado de cada uma.
#
# Fase experimental, custo zero: plano free (sem banco Postgres pago) e
# SQLite no próprio disco do serviço. O disco do plano free é efêmero —
# os dados (leads, clientes) somem a cada deploy/restart. O startCommand
# roda as migrações e recria o usuário admin (via ADMIN_*) sozinho a cada
# boot, então o site sempre sobe utilizável mesmo depois de perder o
# banco. Quando o negócio justificar o custo, trocar pra um banco
# persistente é só definir DATABASE_URL e voltar o plano pra "starter".
services:
  - type: web
    name: avie-app
    runtime: python
    plan: free
    buildCommand: "pip install --retries 5 --timeout 100 -r requirements.txt"
    startCommand: "flask db upgrade && flask seed-admin && flask seed-demo-client && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: AVIE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ROLE
        value: owner
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
