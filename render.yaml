# Blueprint do Render (render.com) — permite criar o serviço web de uma vez
# só via "New +" → "Blueprint" no painel do Render, apontando para este
# repositório. Depois disso só falta preencher, no painel, as variáveis
# marcadas como "sync: false" — ver o passo a passo de deploy para o
# significado de cada uma.
#
# IMPORTANTE: o serviço web "avie-app" já existe e foi criado manualmente
# no painel do Render — este arquivo não é aplicado automaticamente nele.
# Ele documenta a configuração pretendida (infraestrutura-como-código) mas
# qualquer mudança aqui só tem efeito em produção depois de alguém colar
# a mudança correspondente em Settings → Build & Deploy / Environment no
# painel do Render.
#
# databases.avie-db: banco PostgreSQL gerenciado pelo Render — decisão do
# negócio de sair do SQLite efêmero (ver seção "Fase 0" no relatório
# estratégico da sessão) usando o mesmo provedor que já hospeda o app, em
# vez de um Postgres gratuito de terceiro (Supabase/Neon). Tem custo
# mensal (plano "starter" do Postgres do Render) — ainda não provisionado
# no painel; até isso acontecer, produção continua no SQLite efêmero do
# plano web free (ver nota abaixo). Quando o banco for criado no painel,
# DATABASE_URL passa a vir de lá (fromDatabase), sem precisar colar a
# connection string manualmente numa env var "sync: false".
databases:
  - name: avie-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: avie-app
    runtime: python
    plan: free
    buildCommand: "pip install --retries 5 --timeout 100 -r requirements.txt"
    startCommand: "flask db upgrade && flask seed-admin && flask seed-demo-client && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: AVIE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: avie-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ROLE
        value: owner
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
